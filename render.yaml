services:
  - type: web
    name: dic-caso-404
    runtime: node
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: dic-data
      mountPath: /var/data
      sizeGB: 1
